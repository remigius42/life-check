# spellchecker:ignore numpy pydocstyle

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]  # pycodestyle, pyflakes, isort, pydocstyle
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",  # missing-docstring rules not enforced by Codacy/Prospector
    "D203",  # conflicts with black (black enforces D211: no blank line before class docstring)
    "D213",  # conflicts with D212 — using D212 (summary on first line)
]

[tool.pydocstyle]
ignore = [
    "D203",  # conflicts with black (D211)
    "D213",  # conflicts with D212 — using D212
    "D406",  # not using numpy style
    "D407",  # not using numpy style
]

# bandit runs via Codacy (not pre-commit); this config only applies there
[tool.bandit.assert_used]
skips = ["*/test_*.py"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# RPi.GPIO is hardware-only and not installed on dev machines
reportMissingModuleSource = "none"
